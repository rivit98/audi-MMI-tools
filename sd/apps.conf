# Settings of the apps, read by run.sh, screens.sh and the runner (on the
# card). Every app is in apps/ on the card; run.sh starts SD_APPS (`make sd
# SD_APPS=...`, default: the runner, which offers apps/ as a menu). An app
# without a line here still shows in the menu (file name, 1 h timeout).
#
# name|timeout s|arguments after <sd_path>|title|what you see / what to do
#
# Timeout = the app's run time + watchdog slack + teardown, with margin;
# run.sh sends TERM when it is reached, KILL 15 s later. The title is shown
# on the result screen; the text is a description only (each app shows its
# own instructions). Results: each app's src/<app>/README.md.
hello|30||Toolchain smoke test|Nothing on screen. Writes var/hello.txt ("hello world") to the card and exits at once.
hello1_rust|30||Rust (gccrs) smoke test|Nothing on screen. The same as hello, built from Rust by gccrs: writes var/hello.txt and exits at once.
lmprobe|45||Layer manager probe, no OpenGL (5 s)|Nothing to do. Eight vertical colour bars replace the picture for 5 s, drawn straight into the layer manager's frame buffer; then the normal screen comes back.
hello2|90||OpenGL ES test (20 s)|A background slowly changing colour, a rotating square, a bouncing block and a progress bar.
hello3|110||GPU canvas and fill rate (3 x 10 s)|1: random coloured blocks that get smaller. 2: flowing plasma. 3: the plasma in more and more layers.
# hello4: 16 tori or more freeze the unit; the default steps stop at 12.
hello4|160|step=10 trace=1|3D test: probes, 3 scenes, rings (~1.5 min)|Probe squares top right (green = pass), then cubes, a gold ring, a checkerboard world, then 1-12 rings. If the picture stops for more than 30 s, reboot: hold MENU + rotary knob + top-right soft key.
hello8|150|20|C++ test (~35 s)|Nothing to do. 19 checks fill in one by one: PASS in green, or FAIL in red. Take a photo if any is red.
# hello5: steps "pd" = p (who talks to whom, no sound) then d (nav voice
# channel over HBDSI, docs/hbdsi.md). Other steps: m n t v g (README).
hello5|540|pd|MMI connections + the nav voice channel (~3 min)|Have the RADIO ON at a normal volume and FILM WITH SOUND. About a minute of "step 1/2", then step 2 asks the MMI for the navigation voice channel: did the radio get quieter, are the 6 pings heard, is the radio back? Then 4 other sources, one screen each, and 3 control pings. If the MMI reboots, note what was on screen.
# hello6 and hello9 need the clips/ folder, which make sd adds for them.
hello6|960||Video test (~6 min)|Park the car. Ten test videos, each shown two ways, ~7 s each. Turn the main knob ONE click whenever you see the moving picture. A black screen is a result too.
hello9|540||Streaming test (~4.5 min)|Park the car and film the screen. Eight test videos; turn the main knob ONE click whenever the moving picture appears, and once more each time it moves again after a freeze. A black screen is a result too.
hello10|400||Capture width + software decoder (about 3 min)|Park the car and film the screen. Three videos in a row: 720, 800 (the capture width changed in memory for that one), 720; turn the main knob ONE click whenever the moving picture appears. Then the software decoder: 20 s with nothing moving, then the 800x480 test video twice (15 s, 10 s); nothing to do, just film it. A black screen is a result too.
# hello11 is read only (ch4, ch5, ndr, slog); every step waits for a knob click.
hello11|1860||Rear camera, lights, light sensor (~10 min)|Parked in P, ignition on, light switch at 0. The first screen lists the whole test; one knob click starts it. Then follow the screen: lights on/off twice, switch to AUTO and cover/uncover the light sensor twice, R and P twice, turning the main knob ONE click after each. The screen hides while the camera is shown; that is expected.
hello7|940||Knob and button tester, guided (~3 min)|The screen names one control at a time (main knob, joystick, soft keys, BACK, MENU, source keys, volume knob, skip keys, touch pad, steering wheel): press or turn it, then wait; it moves on 2 s later. Controls the car does not have: touch nothing, it moves on in 15 s. The MMI still reacts to every key; this screen comes back by itself. Free mode instead: arguments "60" (seconds).
# runner: a menu of every binary in the card's apps/, started by run.sh by
# default. A line here is optional for those: it adds title, text,
# arguments and timeout. Until the SD card is pulled.
runner|86400||Test menu (until SD pulled)|Turn the main knob to choose an app, press it to run it; its verdict shows in the menu afterwards. The MMI reacts to the knob too. "Leave the menu" (last line) ends the run. Install an app: copy its binary into apps/ on the card.
# audi_stream_receiver and android_auto run until the card is pulled
# (timeout 24 h), so either one is the last app of a run.
audi_stream_receiver|86400||Phone screen over USB (until SD pulled)|Plug the phone in; the bar turns green when the Audi streaming app is connected. Tap Stream screen on the phone and allow the capture. Pull the SD card to end the run.
# android_auto needs aa/headunit.crt + .key on the card (make sd copies them).
android_auto|86400||Android Auto (until SD pulled)|Plug the phone in, unlocked, and leave MIUI's "Use USB for" popup alone. The status page shows each connection step and the video frames (counted, not shown). Pull the SD card to end it.
