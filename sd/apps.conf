# Test apps run by run.sh, read by run.sh (on the card) and sdk/mkscreens.py
# (for the screens). Which ones run, and in which order: `make sd SD_APPS=...`.
#
# name|timeout s|arguments after <sd_path>|title|what you see / what to do
#
# The timeout is the app's own run time + its watchdog slack + teardown,
# with margin. run.sh sends TERM when it is reached, KILL 15 s later.
# Title and text are shown on the app's screens (the text is word-wrapped).
hello|30||Toolchain smoke test|Nothing on screen. Writes hello.txt ("hello world") to the card and exits at once. If the file is there, programs built with this toolchain run on the MMI.
hello2|90||OpenGL ES test (20 s)|The MMI picture is replaced by a background slowly changing colour, a rotating red/green/blue/yellow square, a white block bouncing along the top and a yellow progress bar. Saves screenshots to the card. Any button ends it early.
hello3|110||GPU canvas and fill rate (3 x 10 s)|1: random coloured blocks that get smaller. 2: flowing rainbow plasma. 3: the plasma in more and more layers (yellow number). Green frame counter top left. Any button ends it early.
hello4|130||3D pipeline test (4 x 10 s)|Squares top right: green = check passed, red = failed. Then: two cubes cutting through each other, a gold ring with a moving light, a chequered world with crates, a grid of rings (yellow number = count). Any button ends it early.
hello5|70|30|Audio: knob beep (30 s)|The picture does not change. Turn the main rotary knob: every click should beep. Ends after 30 s; any button ends it early.
