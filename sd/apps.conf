# Settings of the apps, read by the runner (on the card). Every app is in
# apps/ on the card and shows in the runner's menu under its file name. A
# line here is optional: without one an app gets no arguments and a 1 h
# timeout, and follows the listed ones by name.
#
# name|timeout s|arguments after <sd_path>|what you see / what to do
#
# Timeout = the app's run time + watchdog slack + teardown, with margin; the
# runner sends TERM when it is reached, KILL 15 s later. The text shows
# under the menu for the selected app (each app shows its own instructions
# when it runs). Results: each app's src/<app>/README.md.
hello|30||Nothing on screen. Writes var/hello.txt ("hello world") to the card and exits at once.
lmprobe|45||Nothing to do. Eight vertical colour bars replace the picture for 5 s, drawn straight into the layer manager's frame buffer; then the normal screen comes back.
hello2|90||A background slowly changing colour, a rotating square, a bouncing block and a progress bar.
hello3|110||1: random coloured blocks that get smaller. 2: flowing plasma. 3: the plasma in more and more layers.
# hello4: 16 tori or more freeze the unit; the default steps stop at 12.
hello4|160|step=10 trace=1|Probe squares top right (green = pass), then cubes, a gold ring, a checkerboard world, then 1-12 rings. If the picture stops for more than 30 s, reboot: hold MENU + rotary knob + top-right soft key.
hello8|150|20|Nothing to do. 19 checks fill in one by one: PASS in green, or FAIL in red. Take a photo if any is red.
# hello5 is retired: every step is answered. It runs every step but d (nav
# voice channel over HBDSI), which broke MMI3GApplication. Steps: README.
hello5|900||Have the RADIO ON at a normal volume and FILM WITH SOUND. Six steps, each named on screen with what to do: half a minute with no sound (the screen names what it reads); pings over the radio; pings through our own player; pings while MEDIA plays music; the output survey (count the chimes in each group, note any group that cuts the radio); pings while you turn the volume knob 3 clicks down and 3 up.
# hello6 and hello9 need the clips/ folder, which make sd adds for them.
hello6|1200||Park the car. Four phases: system info and CPU tests (nothing to do), then ten test videos, each shown two ways, ~7 s each: turn the main knob ONE click whenever you see the moving picture (a black screen is a result too). Then flickering GPU tests, last: they can freeze the MMI; if the picture stops for 30 s, reboot (MENU + main knob + top-right soft key).
hello9|960||Park the car, radio ON, film the screen WITH SOUND. Ten test videos (~6 min), each named on the screen first. Turn the main knob ONE click whenever the moving picture appears, and once more each time its counter speeds up or slows down. The last six play a beep with every white flash: say out loud if the beeps are missing, late, early or choppy. A black screen is a result too.
hello10|600||Park the car, radio on, and film the screen; turn the main knob ONE click whenever the moving test video appears. A second copy of the media service plays a video (it fails, then the original plays it), then a read-only look at the media service (nothing to do). If the radio goes quiet or the screen stops, note when, then restart the MMI (MENU + main knob + top-right key). A black screen is a result too.
# hello12 needs clips/a1_sbc_ping.sbc + a2_sbc_sweep.sbc (make sd). Steps "wfsSW".
hello12|660||Radio ON at a normal volume, film with sound, and have the phone connected over Bluetooth. First a read-only look at the Bluetooth stack (no sound), then three sounds of 20 s, each named on the screen first: pings, then a rising tone twice. The radio goes quiet while they play. Say out loud what you hear: clean, choppy, too fast or slow, or nothing. Last, start music on the phone in Media -> Bluetooth audio: hello12 takes over the Bluetooth stream for 2 minutes; when the screen says so, switch Media to the radio and back to Bluetooth audio (the rising tone instead of the music?), and after the stand-in is removed once more (the music back?).
# hello11 is read only (ch4, ch5, ndr, slog); every step waits for a knob click.
hello11|1320||Parked in P, ignition on, light switch at 0. The first screen lists the whole test; one knob click starts it. Then follow the screen: lights on/off twice, then switch at AUTO and the light sensor dark/bright twice (daylight: cover/uncover it; night: phone torch on it for bright), turning the main knob ONE click after each.
hello7|760||The screen asks one thing at a time: roll the steering wheel volume up and down; tap, double tap, touch the corners of and draw on the touch pad; then the same in each pad mode hello7 sets (it writes the HMI's mode command to ch8); then on the HMI's radio, map and speller screens. A step moves on a few seconds after you stop, or after 15 s with nothing. The MMI still reacts to everything; this screen comes back by itself. Free mode instead: arguments "60" (seconds).
# audi_stream_receiver and android_auto run until the card is pulled
# (timeout 24 h), so either one is the last app of a run.
audi_stream_receiver|86400||Plug the phone in; the bar turns green when the Audi streaming app is connected. Tap Stream screen on the phone and allow the capture. Pull the SD card to end the run.
# android_auto needs aa/headunit.crt + .key on the card (make sd copies them).
android_auto|86400||Plug the phone in, unlocked, and leave MIUI's "Use USB for" popup alone. The status page shows each connection step and the video frames (counted, not shown). Pull the SD card to end it.
