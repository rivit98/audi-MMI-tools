# Test apps run by run.sh, read by run.sh and screens.sh (on the card, for
# the screens). Which ones run, and in which order: `make sd SD_APPS=...`.
#
# name|timeout s|arguments after <sd_path>|title|what you see / what to do
#
# The timeout is the app's own run time + its watchdog slack + teardown,
# with margin. run.sh sends TERM when it is reached, KILL 15 s later.
# The title is shown on the app's result screen. The text (what you see /
# what to do) is not shown on screen: each app shows its own instructions.
# It stays here as the description.
# hello, lmprobe, hello2 and hello3 are still built, but are not in the
# Makefile's default TESTS any more (so not on the card): all four have
# passed on the car and have nothing left to tell us (docs/platform-notes.md,
# docs/gpu-results.md). Uncomment a line and add the app to SD_APPS to run
# it again.
#hello|30||Toolchain smoke test|Nothing on screen. Writes var/hello.txt ("hello world") to the card and exits at once. If the file is there, programs built with this toolchain run on the MMI.
#lmprobe|45||Layer manager probe, no OpenGL (5 s)|Eight vertical colour bars (white, yellow, cyan, green, magenta, red, blue, black) replace the picture for 5 s, drawn straight into the layer manager's frame buffer. Saves lmprobe_dshot.png and lmprobe_sshot.png to the card.
#hello2|90||OpenGL ES test (20 s)|The MMI picture is replaced by a background slowly changing colour, a rotating red/green/blue/yellow square, a white block bouncing along the top and a yellow progress bar. Saves screenshots to the card.
#hello3|110||GPU canvas and fill rate (3 x 10 s)|1: random coloured blocks that get smaller. 2: flowing rainbow plasma. 3: the plasma in more and more layers (yellow number). Green frame counter top left.
# hello4: the probes and scenes cube/light/world pass, and so do the stress
# steps 1, 2, 4, 8 and 12 tori. 16 tori freeze the whole unit on the first
# frame (docs/gpu-results.md sections 8-9). Stress steps 16 and up stay
# commented out in src/hello4/main.c (opts_default). It is not in the
# default run; put it last before audi_stream_receiver. ~85 s + 40 s
# watchdog slack + teardown.
#hello4|160|step=10 trace=1|3D test: probes, 3 scenes, rings (~1.5 min)|First a row of small squares top right (green = pass, red = fail). Then 10 s each: two colourful cubes, a gold ring with moving lights, a checkerboard world with crates and fog. Then a growing grid of coloured rings (yellow number = count): 1, 2, 4, 8, 12, 10 s each. If the picture stops moving for more than 30 s, note what was on screen and the yellow number, then reboot: hold MENU + rotary knob + top-right soft key.
# hello8: C++ (GCC 16's libstdc++, linked statically). 18 checks of the
# language runtime and the standard library, run one after the other, then
# the results stay up for 20 s (argument). ~35 s; the watchdog allows the
# checks 60 s more. All 19 pass ("atomics stress": gUSA atomics lose
# updates, LL/SC ones don't; the SDK builds with LL/SC). Not in the default
# run.
hello8|150|20|C++ test (~35 s)|Nothing to do. A list of 19 checks fills in one by one: PASS in green, or FAIL in red with what went wrong underneath. The results stay on screen for 20 s; take a photo if any is red. If the screen stops changing for more than a minute, note the check marked RUN.
# hello5: sound through io-media. io-audio devices and mixer outputs
# TDM1 2.0 / TDM2 2.0 are not heard (TDM1 2.0 cuts the radio). Group N = N
# chimes on TDM1 2.0 SAD, TDM1 5.1, TDM3 2.0 SAD, TDM2 2.0 SAD, TDM3 2.0
# (2.5 s chime): group 1 (TDM1 2.0 SAD) is heard, group 2 (TDM1 5.1) mutes
# the car audio, groups 3-5 are silent. Its knob log decoded every knob and
# is hello7 now.
# Steps m, n, t, v (argument; "g" is the old group survey):
# pings every 2 s on TDM1 2.0 SAD with the radio (does it keep playing
# between them?), through hello5's own io-media client with its own volume
# at 0 for pings 4-6, with music from MEDIA, and while the volume knob is
# turned. All four are answered: the pings replace the radio (m, n) and
# Bluetooth music (t), follow the volume knob (v), and hello5's own volume
# 0 changes nothing (n). After MEDIA, hello5's once-a-second re-show
# (screen_set_reshow) brings its screen back over the MMI's Media screen.
# Not in the default run. The line below runs step t only; for all four
# steps: mntv|290. ~45 s; the watchdog allows ~83 s if playback gets stuck.
hello5|120|t|Sound with music, screen after MEDIA (~45 s)|Film the screen WITH SOUND. During the 25 s countdown press MEDIA and start some music (USB, Bluetooth, Jukebox, CD). The MMI's Media screen comes up: does hello5's screen come back over it within about a second, and stay without flickering? Then 6 pings, one every 2 s: is the music still playing between them?
# hello6: all ten clips (src/hello6/texts.h, 22 s each), each with capture
# enabled through dev-videoctrl, first on VCAP 1 (black), then on VCAP 0
# input 1 (clip 1 on screen). Needs the clips/ folder, which make sd adds
# when hello6 is in SD_APPS. Optional argument: phases, any of "scgv"
# (default v). ~6 min; the watchdog allows 15 min. Runs after hello9.
hello6|960||Video test (~6 min)|Park the car. Ten test videos (a moving picture with its name and a counting number), each shown two ways one after the other, about 7 s each, with a screen before each video. Turn the main knob ONE click whenever you see the moving picture. A black screen is a result too: just wait. Results stay on screen at the end.
# hello9: the streaming tests (src/hello9/README.md), through the code
# audi_stream_receiver uses: c5 control (a plain MP4), then the
# raw clip c11 pushed frame by frame: live (30 s), gap (pauses of 2 s and
# 5 s, filled with skip frames), slow (15 fps), burst (5 frames at a time),
# then delay tuning: s56 / s112 (frames padded 2x / 4x), f30 (30 fps).
# VCAP 0 input 1 only. Needs the clips/ folder (c5, c9, c11), which make sd
# adds when hello9 is in SD_APPS. Optional argument: tests, e.g.
# "c5,gap,stall" (c9 and stall run only when asked for). ~4.5 min; its own
# watchdog is 8 min. All answered on the car, not in the default run.
hello9|540||Streaming test (~4.5 min)|Park the car and film the screen. Eight test videos (a moving picture with its name and a counting number), with a screen before each. Turn the main knob ONE click whenever you see the moving picture. In the pause test the picture freezes twice - turn the knob ONE more click each time it starts moving again. A black screen is a result too: just wait. Results stay on screen at the end.
# hello10: can the DM642 show an 800x480 stream whose SPS the MMI cropped
# to 720 (src/hello10/README.md)? c5 control, then the 800x480 clip c12
# cropped to 720x480 (30 s), to 720x416 (20 s), and at 15 fps (20 s). Needs
# the clips/ folder (c5, c12), which make sd adds when hello10 is in
# SD_APPS. Optional argument: tests, e.g. "crop". ~2.5 min; its own
# watchdog is 5 min.
hello10|360||800 wide cropped to 720 (~2.5 min)|Park the car and film the screen. Four test videos, with a screen before each. Turn the main knob ONE click whenever you see the moving picture. Watch for a red band on the right (crop ignored) and, in the second test, a blue band at the bottom. A black screen is a result too: just wait. If the radio or screen stops working afterwards, restart the MMI.
# hello7: knob and button tester, a tool rather than a test, out of the
# Makefile's default TESTS: the MMI handles every button too,
# and MENU / BACK switched its own screens over hello7's for the rest of
# the run. Run it with `make sd SD_APPS="hello7 ..."`. Argument: seconds
# (default 60).
hello7|100|60|Knob and button tester (60 s)|Turn any knob and press any button, one at a time. Each one is named on screen and counted; a control hello7 does not know yet shows as "unknown" with its byte and bits. The MMI still reacts to them too, so mind what you press.
# audi_stream_receiver runs until the card is pulled (timeout = 24 h), so it is the
# last app: pulling the card ends it and the run.
audi_stream_receiver|86400||Phone screen over USB (until SD pulled)|The last test. Plug the phone into the car's USB port. The status bar turns green when the Audi streaming app on the phone is connected. Tap Stream screen on the phone and allow the capture: the phone's screen appears here. Turn the phone, unplug and replug at will. Pull the SD card to end it and the whole run.
# android_auto: an Android Auto head unit, proof of connectivity
# (src/android_auto/README.md). Runs until the card is pulled, like
# audi_stream_receiver: only one of the two can run (run.sh's APPS line).
# Needs aa/headunit.crt + .key on the card (make sd copies them).
android_auto|86400||Android Auto (until SD pulled)|Plug the phone into the car's USB port, unlocked, and leave MIUI's "Use USB for" popup alone. Android Auto starts on the phone; the status page shows each connection step, the phone's name and the video frames it sends (saved to var/android_auto.h264, not shown). Pull the SD card to end it.
