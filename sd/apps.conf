# Test apps run by run.sh, read by run.sh and screens.sh (on the card, for
# the screens). Which ones run, and in which order: `make sd SD_APPS=...`.
#
# name|timeout s|arguments after <sd_path>|title|what you see / what to do
#
# The timeout is the app's own run time + its watchdog slack + teardown,
# with margin. run.sh sends TERM when it is reached, KILL 15 s later.
# Title and text are shown on the app's screens (the text is word-wrapped).
# hello, lmprobe, hello2 and hello3 are still built and still copied to the
# card, but are not in the Makefile's default TESTS any more: all four have
# passed on the car and have nothing left to tell us (docs/platform-notes.md,
# docs/gpu-results.md). Uncomment a line and add the app to SD_APPS to run
# it again.
#hello|30||Toolchain smoke test|Nothing on screen. Writes hello.txt ("hello world") to the card and exits at once. If the file is there, programs built with this toolchain run on the MMI.
#lmprobe|45||Layer manager probe, no OpenGL (5 s)|Eight vertical colour bars (white, yellow, cyan, green, magenta, red, blue, black) replace the picture for 5 s, drawn straight into the layer manager's frame buffer. Saves lmprobe_dshot.png and lmprobe_sshot.png to the card.
#hello2|90||OpenGL ES test (20 s)|The MMI picture is replaced by a background slowly changing colour, a rotating red/green/blue/yellow square, a white block bouncing along the top and a yellow progress bar. Saves screenshots to the card.
#hello3|110||GPU canvas and fill rate (3 x 10 s)|1: random coloured blocks that get smaller. 2: flowing rainbow plasma. 3: the plasma in more and more layers (yellow number). Green frame counter top left.
# hello4: the probes and scenes cube/light/world passed on 2026-10-11, then
# the stress scene froze the whole unit at 8 tori (docs/gpu-results.md).
# Now only the stress scene runs, with a 60 s hold at 8 tori and a log line
# per frame (arguments: top of src/hello4/main.c). 100 s + 40 s watchdog
# slack + teardown. It may freeze the MMI again, so the Makefile runs it
# after hello5 and hello6.
hello4|170|scenes=s step=5 tori=1,2,4,8:60,12,16,24,32,64 trace=1|3D stress: rings until it breaks (~2 min)|A growing grid of coloured rings (yellow number = count): 1, 2, 4, then 8 for a whole minute, then 12 up to 64. THIS MAY FREEZE THE MMI, as it did last time. If the picture stops moving for more than 30 s, note the yellow number, then reboot: hold MENU + rotary knob + top-right soft key.
hello5|70|30|Audio: knob beep (30 s)|The picture does not change. Turn the main rotary knob: every click should play a short two-note chime. Ends after 30 s. If there is no sound, var/hello5.log says which audio parameter the driver rejected.
# hello6 needs the driver watching (~5 min) and the clips/ folder, which
# make sd adds when hello6 is in SD_APPS. Optional argument: phases, any of "scgv".
hello6|720||Video decoder + speed tests (~5 min)|Park the car. Text screens explain each step. First 10 short test videos: turn the main knob ONE click whenever you see a moving test picture. Then about a minute of flickering test patterns (benchmarks). They froze the MMI last time: if the picture stops for 30 s, reboot (MENU + rotary knob + top-right soft key). Results stay on screen for 20 s at the end.
# usb_tx_test runs until the card is pulled (timeout = 24 h), so it is the
# last app: pulling the card ends it and the run.
usb_tx_test|86400||USB text from the phone (until SD pulled)|The last test. Plug the phone into the car's USB port. The status bar turns green when the usb_tx_test app on the phone is connected; text sent from the phone appears here and in usb_tx_test.log on the card. Unplug and replug at will. Pull the SD card to end it and the whole run.
